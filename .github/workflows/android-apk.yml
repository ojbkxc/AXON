name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Git tag (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved TAG=$TAG VERSION=$VERSION"

  build-android:
    needs: get-version
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    env:
      APP_NAME: AXON
      VERSION: ${{ needs.get-version.outputs.version }}
      TAG: ${{ needs.get-version.outputs.tag }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        run: |
          if [ -d "/usr/local/lib/android/sdk/ndk" ]; then
            NDK=$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | sort -V | tail -1 | sed 's:/$::')
            if [ -n "$NDK" ]; then echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV; echo "Found NDK: $NDK"; fi
          fi
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            echo "Downloading NDK r27c..."
            curl -fsSL https://dl.google.com/android/repository/android-ndk-r27c-linux.zip -o /tmp/ndk.zip
            sudo mkdir -p /usr/local/lib/android/sdk/ndk
            sudo unzip -q /tmp/ndk.zip -d /usr/local/lib/android/sdk/ndk
            echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/android-ndk-r27c" >> $GITHUB_ENV
          fi

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked
          rustup target add aarch64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package.json

      - name: Build Web UI
        run: |
          cd ui && npm install --no-audit --no-fund && npm run build
          test -f dist/index.html

      - name: Cross-compile axon (arm64-v8a)
        run: |
          cargo ndk --target aarch64-linux-android --platform 21 -- build --release -p axon-server
          ls -lh target/aarch64-linux-android/release/axon

      - name: Prepare APK assets
        run: |
          mkdir -p android/apk/src/main/assets
          cp target/aarch64-linux-android/release/axon android/apk/src/main/assets/axon
          chmod +x android/apk/src/main/assets/axon
          cp config.example.yaml android/apk/src/main/assets/config.yaml

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Diagnose environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 || echo "::error::java not found"
          gradle -version 2>&1 | head -10 || echo "::error::gradle not found"
          ls -la "$ANDROID_HOME" 2>&1 | head -20 || echo "::error::ANDROID_HOME dir missing"
          ls "$ANDROID_HOME/platforms" 2>&1 || echo "::error::no platforms"
          ls "$ANDROID_HOME/build-tools" 2>&1 || echo "::error::no build-tools"
          echo "sdk.dir=$ANDROID_HOME" > android/apk/local.properties
          echo "local.properties written"

      - name: Build APK
        working-directory: android/apk
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::error::gradle assembleRelease failed (exit $rc). Extracting errors:"
            grep -iE "FAILURE:|What went wrong|Could not|SDK location|sdk.dir|ANDROID_HOME|build-tools|unresolved|No such file|Task .*FAILED|> Task.*FAILED|error:|Caused by:" /tmp/gradle.log | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            echo "=== last 40 lines of gradle log ==="
            tail -40 /tmp/gradle.log
            exit 1
          fi

      - name: Package APK
        run: |
          mkdir -p dist
          apk_path=$(find android/apk/build/outputs/apk -type f -name '*.apk' -print -quit)
          if [ -z "$apk_path" ]; then echo "::error::APK not found"; exit 1; fi
          echo "Found APK: $apk_path"
          ls -lh "$apk_path"
          cp "$apk_path" "dist/${APP_NAME}-v${VERSION}-android-arm64-v8a.apk"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: axon-apk-arm64-v8a
          path: dist/AXON-v*-android-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [get-version, build-android]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.get-version.outputs.tag }}
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: axon-apk-arm64-v8a
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          {
            echo "## AXON $TAG"
            echo ""
            echo "### Downloads"
            echo ""
            echo "- \`AXON-v${VERSION}-android-arm64-v8a.apk\` — Android APK (arm64-v8a)"
            echo ""
            echo "### Notes"
            echo ""
            echo "- Cross-compiled Rust binary (aarch64-linux-android) embedded in WebView shell"
            echo "- Web UI (React + Vite) embedded in binary via \`include_dir!\`"
            echo "- Binary size < 50MB hard constraint"
          } > /tmp/release_notes.md
          gh release create "$TAG" \
            --title "AXON $TAG" \
            --notes-file /tmp/release_notes.md \
            --target ${{ github.sha }} \
            $(find dist -type f)
